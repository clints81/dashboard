<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reading</title>

  <!-- Home screen install: the phone's own manifest and icon (portrait) -->
  <link rel="manifest" href="read-manifest.json">
  <link rel="apple-touch-icon" href="read-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Reading">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf6ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#231c18" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ── Design tokens ──
       Light: the iPad page's warm palette. Dark: the same warmth carried
       into a brown-black (the sit-with card and the icon), not an
       inversion. Follows the system setting. */
    :root {
      --bg:        oklch(0.978 0.010 82);
      --bg-2:      oklch(0.958 0.013 78);
      --line:      oklch(0.900 0.013 75);
      --line-2:    oklch(0.800 0.017 74);
      --ink-4:     oklch(0.620 0.011 70);
      --ink-3:     oklch(0.500 0.011 70);
      --ink-2:     oklch(0.340 0.011 70);
      --ink:       oklch(0.200 0.011 70);
      --accent:    oklch(0.580 0.150 32);
      --accent-ink: oklch(0.985 0.008 82);
      --toast-bg:  oklch(0.250 0.012 60);
      --toast-ink: oklch(0.950 0.012 80);

      --sans:  'Geist', ui-sans-serif, system-ui, sans-serif;
      --serif: 'Instrument Serif', 'Source Serif Pro', Georgia, serif;
      --mono:  'Geist Mono', ui-monospace, Menlo, monospace;
      --side:  22px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:        oklch(0.215 0.012 52);
        --bg-2:      oklch(0.250 0.013 54);
        --line:      oklch(0.310 0.013 56);
        --line-2:    oklch(0.420 0.014 60);
        --ink-4:     oklch(0.560 0.012 70);
        --ink-3:     oklch(0.680 0.012 74);
        --ink-2:     oklch(0.820 0.012 78);
        --ink:       oklch(0.930 0.013 82);
        --accent:    oklch(0.720 0.125 40);
        --accent-ink: oklch(0.215 0.012 52);
        --toast-bg:  oklch(0.330 0.014 58);
        --toast-ink: oklch(0.950 0.012 80);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

    .page {
      max-width: 620px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 26px)
               max(var(--side), env(safe-area-inset-right))
               calc(env(safe-area-inset-bottom) + 56px)
               max(var(--side), env(safe-area-inset-left));
    }

    /* ── Masthead ── */
    .masthead { padding-bottom: 22px; border-bottom: 1px solid var(--line); }
    .masthead-date {
      font-family: var(--serif);
      font-size: 34px;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }
    .masthead-weather { margin-top: 6px; font-size: 14px; color: var(--ink-3); }

    /* ── Sections ── */
    .section { padding-top: 30px; }
    .section + .section { margin-top: 10px; border-top: 1px solid var(--line); }
    .label {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 11.5px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 16px;
    }
    .label-meta { letter-spacing: 0.04em; text-transform: none; font-weight: 400; color: var(--ink-4); }
    .note { font-size: 15px; color: var(--ink-3); font-style: italic; }
    .error { font-size: 15px; color: var(--ink-3); }

    /* Key lines: why marks or marking are off on this device, never a
       blank that looks like a quiet day or a broken button. */
    .keyline { font-size: 13.5px; color: var(--ink-3); margin: -6px 0 14px; }
    .keyline button { color: var(--accent); font-weight: 500; padding: 6px 0; }
    .keyform { display: flex; flex-direction: column; gap: 10px; margin: 0 0 18px; }
    .keyform label { font-size: 12.5px; color: var(--ink-3); display: flex; flex-direction: column; gap: 4px; }
    .keyform input {
      font: inherit; font-size: 16px; color: var(--ink);
      background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 10px;
      padding: 10px 12px; width: 100%;
    }
    .keyform input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 22%, transparent); }
    .keyform-row { display: flex; gap: 14px; align-items: center; }
    .keyform .save {
      background: var(--accent); color: var(--accent-ink); border-radius: 10px;
      padding: 10px 18px; font-weight: 500;
    }
    .keyform .cancel { color: var(--ink-3); padding: 10px 4px; }

    /* ── Reading list ── */
    .pick {
      display: grid;
      grid-template-columns: 1fr 44px;
      column-gap: 14px;
      padding: 18px 0;
      border-top: 1px solid var(--line);
    }
    .list > .pick:first-child { border-top: 0; padding-top: 4px; }
    .pick-link { display: block; min-width: 0; }
    .kicker {
      font-size: 12px; letter-spacing: 0.04em; color: var(--ink-4);
      margin-bottom: 5px;
    }
    .kicker b { font-weight: 500; color: var(--accent); }
    .pick-head {
      font-family: var(--serif); font-weight: 400;
      font-size: 23px; line-height: 1.2; letter-spacing: -0.005em;
      color: var(--ink);
    }
    .pick-desc {
      margin-top: 6px; font-size: 15px; line-height: 1.5; color: var(--ink-3);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pick-meta { margin-top: 7px; font-size: 13px; color: var(--ink-4); }

    /* Today's pick: larger, with its full description. */
    .pick.today { padding-bottom: 24px; }
    .pick.today .pick-head { font-size: 31px; line-height: 1.12; }
    .pick.today .pick-desc { white-space: normal; font-size: 16px; color: var(--ink-2); margin-top: 10px; }
    .pick.today .pick-meta { margin-top: 10px; }

    /* The done control: a full 44pt target, apart from the link, so a tap
       meant for the headline can't mark it and a mark can't open it. */
    .done {
      width: 44px; height: 44px; margin-top: 14px;
      display: grid; place-items: center; align-self: start;
      border-radius: 50%;
    }
    .done-ring {
      width: 28px; height: 28px; border-radius: 50%;
      border: 1.5px solid var(--line-2);
      display: grid; place-items: center;
      transition: background-color .15s, border-color .15s;
    }
    .done-ring svg { width: 15px; height: 15px; opacity: 0; transition: opacity .15s; }
    .done:active .done-ring { border-color: var(--accent); }
    .done[aria-pressed="true"] .done-ring { background: var(--accent); border-color: var(--accent); }
    .done[aria-pressed="true"] svg { opacity: 1; }
    .done[aria-disabled="true"] { opacity: .45; }
    .done-ring svg path { stroke: var(--accent-ink); }

    .caught-up { font-size: 15px; color: var(--ink-3); padding: 6px 0 4px; }

    /* Read: collapsed, so nothing disappears and nothing nags. */
    .read-section { margin-top: 18px; border-top: 1px solid var(--line); }
    .read-section summary {
      list-style: none; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      min-height: 52px; font-size: 14px; color: var(--ink-3);
    }
    .read-section summary::-webkit-details-marker { display: none; }
    .read-section summary::after { content: '›'; font-size: 20px; color: var(--ink-4); transition: transform .2s; }
    .read-section[open] summary::after { transform: rotate(90deg); }
    .read-section .pick { opacity: .62; }
    .read-section .pick:first-of-type { border-top: 1px solid var(--line); }
    .read-section .pick-desc { display: none; }
    .read-section .pick-head { font-size: 19px; }

    /* ── Devotion and readings ── */
    .verse {
      font-family: var(--serif); font-style: italic;
      font-size: 23px; line-height: 1.35; color: var(--ink);
    }
    .verse-ref { margin-top: 10px; font-family: var(--mono); font-size: 13px; color: var(--accent); }
    .dev-title { margin-top: 18px; font-size: 15px; font-weight: 500; color: var(--ink-2); }
    .dev-excerpt { margin-top: 4px; font-size: 15px; color: var(--ink-3); }
    .dev-links { margin-top: 12px; display: flex; gap: 22px; }
    .dev-links a { color: var(--accent); font-size: 15px; font-weight: 500; padding: 6px 0; }

    .lect { margin-top: 26px; padding-top: 22px; border-top: 1px dashed var(--line-2); }
    .lect-label { font-size: 11.5px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 14px; }
    .lect-event + .lect-event { margin-top: 22px; }
    .lect-when { font-size: 12px; letter-spacing: 0.04em; color: var(--ink-4); }
    .lect-name { font-family: var(--serif); font-size: 21px; line-height: 1.2; margin: 3px 0 10px; }
    .lect-list { display: grid; grid-template-columns: max-content 1fr; column-gap: 16px; row-gap: 6px; }
    .lect-list dt { font-size: 13px; color: var(--ink-4); padding-top: 1px; }
    .lect-list dd { font-size: 15.5px; color: var(--ink); }

    /* ── Briefing ── */
    .synthesis { font-family: var(--serif); font-size: 21px; line-height: 1.4; color: var(--ink); }
    .stale { display: block; font-family: var(--sans); font-size: 13.5px; font-style: italic; color: var(--ink-4); margin-bottom: 6px; }
    .stories { margin-top: 18px; }
    .story { border-top: 1px solid var(--line); }
    .story summary {
      list-style: none; cursor: pointer;
      padding: 13px 0; display: block;
    }
    .story summary::-webkit-details-marker { display: none; }
    .story-cat { display: block; font-size: 11.5px; letter-spacing: 0.06em; color: var(--ink-4); margin-bottom: 2px; }
    .story-title { font-size: 16px; font-weight: 500; line-height: 1.4; color: var(--ink); }
    .story[open] .story-title { color: var(--accent); }
    .story-body { padding: 0 0 16px; }
    .story-sum { font-size: 15px; color: var(--ink-2); }
    .story-open { display: inline-block; margin-top: 8px; font-size: 14px; font-weight: 500; color: var(--accent); padding: 4px 0; }

    /* ── Footer: which keys this device holds ── */
    .footer {
      margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line);
      font-size: 12.5px; color: var(--ink-4);
      display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
    }
    .footer button { color: var(--ink-3); text-decoration: underline; text-underline-offset: 3px; padding: 8px 0; }

    /* ── Undo bar ── */
    .toast {
      position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px);
      transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
      background: var(--toast-bg); color: var(--toast-ink);
      border-radius: 14px; padding: 6px 6px 6px 18px;
      display: flex; align-items: center; gap: 12px;
      font-size: 15px; box-shadow: 0 8px 28px rgb(0 0 0 / .22);
      transition: opacity .2s, transform .2s;
      max-width: calc(100% - 2 * var(--side));
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    .toast button { color: var(--accent); font-weight: 600; padding: 10px 14px; }
    @media (prefers-color-scheme: dark) { .toast button { color: oklch(0.80 0.11 45); } }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
<main class="page">

  <header class="masthead">
    <div class="masthead-date" id="date">&nbsp;</div>
    <div class="masthead-weather" id="weather">Loading weather…</div>
  </header>

  <section class="section" aria-labelledby="list-label">
    <div class="label" id="list-label"><span>Reading list</span><span class="label-meta" id="list-count"></span></div>
    <div id="keyline"></div>
    <div id="list"><div class="note">Loading…</div></div>
  </section>

  <section class="section" aria-labelledby="dev-label">
    <div class="label" id="dev-label"><span>Devotion</span></div>
    <div id="devotion"><div class="note">Loading…</div></div>
    <div class="lect" id="lectionary"><div class="note">Loading readings…</div></div>
  </section>

  <section class="section" aria-labelledby="brief-label">
    <div class="label" id="brief-label"><span>The briefing</span><span class="label-meta" id="brief-count"></span></div>
    <div id="briefing"><div class="note">Loading…</div></div>
  </section>

  <footer class="footer" id="footer"></footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" id="toast-undo">Undo</button></div>

<script src="config.js"></script>
<script src="shared.js"></script>
<script src="read.js"></script>
</body>
</html>
