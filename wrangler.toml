name = "briefing-retrieval"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Every 5 minutes, 06:00–07:55 UTC (1:00–2:55am CDT; 12:00–1:55am CST).
# 06:00 UTC is always after midnight Central, so the run gets the right date.
# A full run takes ~8 ticks; the rest are retries and slack.
[triggers]
# Plus 12:00 UTC (7am CDT / 6am CST): save the Cowork briefing for /compare.
crons = ["*/5 6-7 * * *", "0 12 * * *"]

# Separate from the dashboard Worker's `briefing-store` namespace on purpose.
[[kv_namespaces]]
binding = "POOL"
id = "9ffa5f16b12f4f21a4dd2ed85a2d19ed"

# Read-only link to the dashboard Worker, used by /compare to read Cowork's
# briefing (GET /). Needed because same-account workers.dev fetches fail.
[[services]]
binding = "COWORK"
service = "briefing"

[observability]
enabled = true

# Secrets (set with `npx wrangler secret put <NAME>`, never committed):
#   NYT_API_KEY, GUARDIAN_API_KEY, RUN_KEY
